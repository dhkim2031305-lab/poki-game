<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검은 바람 시안</title>
<style>
  :root{--bg:#0f1420;--panel:#1a2132;--text:#e8ecf4;--muted:#9aa4b8;--accent:#d9c89a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  main{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:4px 0 4px}
  p{color:var(--muted);margin:0 0 12px}
  canvas{width:100%;height:auto;display:block;border-radius:12px;background:#20283a;touch-action:manipulation}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  button{border:1px solid #3a4560;background:var(--panel);color:var(--text);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
  button.on{border-color:var(--accent);color:var(--accent)}
  .fire{background:#2b3550;font-weight:600}
  ul{color:var(--muted);padding-left:18px;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1>검은 바람 스킬 시안</h1>
  <p>장수가 바라보는 방향으로 초승달 모양의 바람이 날아가요. 지나가는 길의 외계인을 치고 뒤로 밀어내요. 화면을 누르거나 아래 버튼으로 쏴 보세요.</p>
  <canvas id="c" width="900" height="420"></canvas>
  <div class="row" role="group" aria-label="색 안">
    <button data-v="black" class="on">A. 검은 바람</button>
    <button data-v="edge">B. 검은 바람 + 은빛 테두리</button>
    <button data-v="white">C. 흰 바람 (지금 색 규칙)</button>
  </div>
  <div class="row">
    <button class="fire" id="fire">바람 쏘기</button>
    <button id="auto" class="on">자동 반복</button>
  </div>
  <ul>
    <li>크기: 장수 키의 약 1.5배인 초승달 · 속도는 약 0.6초 만에 화면을 가로질러요</li>
    <li>꼬리: 검은 연기 가닥이 흩어지며 사라져요</li>
    <li>맞으면: 외계인이 하얗게 번쩍이고 뒤로 밀려나요</li>
  </ul>
</main>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const W=cv.width,H=cv.height;
let variant='black',auto=true,t0=performance.now(),lastAuto=0;
const hero={x:120,y:H/2};
let aliens=[],blades=[],wisps=[];
function resetAliens(){aliens=[];for(let i=0;i<6;i++)aliens.push({x:520+ (i%3)*110,y:110+Math.floor(i/3)*200+(i%2)*30,bx:0,vx:0,hit:0,bob:Math.random()*6})}
resetAliens();
function fire(){blades.push({x:hero.x+40,y:hero.y,vx:1300,life:0,hitSet:new Set()})}
document.getElementById('fire').onclick=fire;
cv.addEventListener('pointerdown',fire);
document.getElementById('auto').onclick=e=>{auto=!auto;e.target.classList.toggle('on',auto)};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b))});
function colors(){
  if(variant==='white')return{core:'rgba(245,247,252,0.95)',mid:'rgba(220,226,238,0.55)',edge:null,wisp:[235,240,250]};
  if(variant==='edge')return{core:'rgba(14,14,20,0.95)',mid:'rgba(30,30,40,0.6)',edge:'rgba(214,220,232,0.9)',wisp:[24,24,32]};
  return{core:'rgba(10,10,14,0.95)',mid:'rgba(28,28,36,0.55)',edge:null,wisp:[20,20,28]};
}
function drawGround(){
  cx.fillStyle='#232c40';cx.fillRect(0,0,W,H);
  cx.strokeStyle='rgba(255,255,255,0.04)';cx.lineWidth=1;
  for(let x=0;x<W;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
  for(let y=0;y<H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
}
function drawHero(t){
  cx.save();cx.translate(hero.x,hero.y);
  cx.fillStyle='rgba(0,0,0,0.3)';cx.beginPath();cx.ellipse(0,34,26,9,0,0,7);cx.fill();
  cx.fillStyle='#8a93a8';cx.beginPath();cx.roundRect(-18,-22,36,52,10);cx.fill();
  cx.fillStyle='#c9ced9';cx.beginPath();cx.arc(0,-30,15,0,7);cx.fill();
  cx.fillStyle='#d9c89a';cx.fillRect(-18,-6,36,5);
  cx.strokeStyle='#cfd4de';cx.lineWidth=4;cx.beginPath();cx.moveTo(16,4);cx.lineTo(44,-14);cx.stroke();
  cx.restore();
}
function drawAlien(a,t){
  const y=a.y+Math.sin(t/300+a.bob)*4,x=a.x+a.bx;
  cx.fillStyle='rgba(0,0,0,0.3)';cx.beginPath();cx.ellipse(x,y+26,22,7,0,0,7);cx.fill();
  cx.fillStyle=a.hit>0?'#ffffff':'#7bd88f';
  cx.beginPath();cx.ellipse(x,y,20,24,0,0,7);cx.fill();
  cx.fillStyle=a.hit>0?'#ffffff':'#1d2a22';
  cx.beginPath();cx.ellipse(x-7,y-6,4,6,0,0,7);cx.ellipse(x+7,y-6,4,6,0,0,7);cx.fill();
}
function drawBlade(b){
  const c=colors(),r=62,thick=22;
  cx.save();cx.translate(b.x,b.y);
  for(let k=3;k>=1;k--){
    cx.globalAlpha=0.18*k;cx.fillStyle=c.mid;
    crescent(-k*22,r+k*4,thick-2);
  }
  cx.globalAlpha=1;cx.fillStyle=c.core;crescent(0,r,thick);
  if(c.edge){cx.strokeStyle=c.edge;cx.lineWidth=2.5;cx.beginPath();cx.arc(-r*0.55,0,r,-1.05,1.05);cx.stroke()}
  cx.restore();
}
function crescent(off,r,th){
  cx.beginPath();
  cx.arc(off-r*0.55,0,r,-1.05,1.05);
  cx.arc(off-r*0.55-th,0,r*0.92,1.0,-1.0,true);
  cx.closePath();cx.fill();
}
function spawnWisps(b,dt){
  const c=colors();
  for(let i=0;i<3;i++)wisps.push({x:b.x-20+Math.random()*10,y:b.y+(Math.random()-0.5)*110,vx:-120-Math.random()*160,vy:(Math.random()-0.5)*60,life:0,max:0.5+Math.random()*0.4,r:6+Math.random()*10,col:c.wisp});
}
function step(now){
  const t=now-t0,dt=Math.min(0.033,(now-(step.last||now))/1000);step.last=now;
  if(auto&&now-lastAuto>2200){fire();lastAuto=now}
  drawGround();drawHero(t);
  for(const a of aliens){
    a.vx*=Math.pow(0.02,dt);a.bx+=a.vx*dt;a.bx*=Math.pow(0.35,dt);a.hit=Math.max(0,a.hit-dt);
    drawAlien(a,t);
  }
  for(const w of wisps){w.life+=dt;w.x+=w.vx*dt;w.y+=w.vy*dt;w.r+=14*dt;
    const al=Math.max(0,1-w.life/w.max)*0.5;cx.fillStyle=`rgba(${w.col[0]},${w.col[1]},${w.col[2]},${al})`;cx.beginPath();cx.arc(w.x,w.y,w.r,0,7);cx.fill()}
  wisps=wisps.filter(w=>w.life<w.max);
  for(const b of blades){b.life+=dt;b.x+=b.vx*dt;spawnWisps(b,dt);
    for(const [i,a] of aliens.entries()){if(!b.hitSet.has(i)&&Math.abs((a.x+a.bx)-b.x)<40&&Math.abs(a.y-b.y)<90){b.hitSet.add(i);a.hit=0.15;a.vx+=520}}
    drawBlade(b)}
  blades=blades.filter(b=>b.x<W+120);
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
